name: Feature Request
description: Suggest an idea or enhancement for pfCentral
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate community feedback! Please explain your proposed feature and how it benefits self-hosters and firewall administrators.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the operational friction or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe what you would like to happen and how it should look or behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
